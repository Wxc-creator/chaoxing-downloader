<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超星学习通下载助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 头部 -->
    <header class="popup-header">
      <div class="header-brand">
        <img src="icons/icon48.png" alt="logo" class="logo-img">
        <div>
          <h1 class="header-title">超星下载助手</h1>
          <span class="header-subtitle" id="site-status">正在检测页面...</span>
        </div>
      </div>
      <button class="icon-btn" id="btn-toggle-settings" title="偏好设置">
        <svg viewBox="0 0 1024 1024" width="18" height="18" fill="currentColor">
          <path d="M924.8 625.7l-65.5-56c3.1-19 4.7-38.4 4.7-57.8s-1.6-38.8-4.7-57.8l65.5-56a32.03 32.03 0 0 0 7.7-40.4l-64.8-112.2c-7.7-13.3-22.8-20.7-38.1-18.7l-83.3 11c-29.2-24.8-63-44.4-100.1-57.5L532.5 163c-3-15.3-16.4-26.6-32.5-26.6h-128c-16.1 0-29.5 11.3-32.5 26.6l-13.6 86.8c-37.1 13.1-70.9 32.7-100.1 57.5l-83.3-11c-15.3-2-30.4 5.4-38.1 18.7L39.6 427.2a32.03 32.03 0 0 0 7.7 40.4l65.5 56c-3.1 19-4.7 38.4-4.7 57.8s1.6 38.8 4.7 57.8l-65.5 56a32.03 32.03 0 0 0-7.7 40.4l64.8 112.2c7.7 13.3 22.8 20.7 38.1 18.7l83.3-11c29.2 24.8 63 44.4 100.1 57.5l13.6 86.8c3 15.3 16.4 26.6 32.5 26.6h128c16.1 0 29.5-11.3 32.5-26.6l13.6-86.8c37.1-13.1 70.9-32.7 100.1-57.5l83.3 11c15.3 2 30.4-5.4 38.1-18.7l64.8-112.2c7.8-13.3 4.5-30.4-7.6-40.4zM512 656c-79.5 0-144-64.5-144-144s64.5-144 144-144 144 64.5 144 144-64.5 144-144 144z"/>
        </svg>
      </button>
    </header>

    <!-- 设置面板 (可折叠) -->
    <section class="settings-drawer" id="settings-drawer" style="display: none;">
      <div class="settings-title">偏好设置</div>
      <div class="setting-item">
        <span>页面右侧显示悬浮助手球</span>
        <label class="switch">
          <input type="checkbox" id="setting-floating-btn" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <span>解除复制限制与右键禁用</span>
        <label class="switch">
          <input type="checkbox" id="setting-unlock-copy" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-item">
        <span>首选下载通道</span>
        <select id="setting-channel" class="custom-select">
          <option value="cs-ans">官方高速 (cs-ans)</option>
          <option value="d0">备用节点 (d0.ananas)</option>
          <option value="pan-yz">云盘直链 (pan-yz)</option>
        </select>
      </div>
    </section>

    <!-- 工具栏 -->
    <section class="action-bar" id="action-bar">
      <div class="file-summary" id="file-summary">检测到 0 个课件</div>
      <div class="action-group">
        <button class="btn btn-secondary" id="btn-refresh" title="重新嗅探当前页面">
          <svg viewBox="0 0 1024 1024" width="13" height="13" fill="currentColor">
            <path d="M756.2 304.3C684.2 232.4 586.3 192 481.9 192c-197.6 0-360 144.3-390.6 332.9-1.9 11.5 6.9 21.6 18.5 21.6h63.2c9.5 0 17.5-6.7 19.1-16.1C217.4 374.3 338 274.7 481.9 274.7c81 0 156.4 31.2 212.1 86.8L618.5 437c-15.1 15.1-4.4 41 17 41h208c11 0 20-9 20-20V250c0-21.4-25.9-32.1-41-17l-66.3 71.3zM914.5 477.5h-63.2c-9.5 0-17.5 6.7-19.1 16.1-25.3 156.1-145.9 255.7-289.8 255.7-81 0-156.4-31.2-212.1-86.8l75.5-75.5c15.1-15.1 4.4-41-17-41h-208c-11 0-20 9-20 20v208c0 21.4 25.9 32.1 41 17l66.3-71.3c72 71.9 169.9 112.3 274.3 112.3 197.6 0 360-144.3 390.6-332.9 1.9-11.5-6.9-21.6-18.5-21.6z"/>
          </svg>
          刷新
        </button>
        <button class="btn btn-primary" id="btn-batch-download" disabled>
          <svg viewBox="0 0 1024 1024" width="13" height="13" fill="currentColor">
            <path d="M505.7 661a8 8 0 0 0 12.6 0l112-141.7c4.1-5.2.4-12.9-6.3-12.9h-74.1V168c0-4.4-3.6-8-8-8h-60c-4.4 0-8 3.6-8 8v338.3H400c-6.7 0-10.4 7.7-6.3 12.9l112 141.8zM878 626h-60c-4.4 0-8 3.6-8 8v154H214V634c0-4.4-3.6-8-8-8h-60c-4.4 0-8 3.6-8 8v198c0 17.7 14.3 32 32 32h684c17.7 0 32-14.3 32-32V634c0-4.4-3.6-8-8-8z"/>
          </svg>
          全部下载
        </button>
      </div>
    </section>

    <!-- 文件列表 -->
    <main class="file-list-container">
      <ul class="file-list" id="popup-file-list">
        <!-- 动态生成 -->
      </ul>
      <div class="empty-state" id="empty-state" style="display: none;">
        <svg viewBox="0 0 1024 1024" width="48" height="48" fill="#d9d9d9">
          <path d="M854.6 288.6L639.4 73.4c-15.6-15.6-36.8-24.4-58.8-24.4H240c-44.2 0-80 35.8-80 80v768c0 44.2 35.8 80 80 80h544c44.2 0 80-35.8 80-80V347.4c0-22-8.8-43.2-24.4-58.8zM604 139.4l156.6 156.6H604V139.4zM792 896H240V128h300v200c0 17.7 14.3 32 32 32h220v536z"/>
        </svg>
        <p class="empty-text">当前页面未检测到可下载课件</p>
        <p class="empty-hint">请进入具体的章节课件页面、课程资料页或文档预览页后查看</p>
      </div>
    </main>

    <!-- 底部状态 -->
    <footer class="popup-footer">
      <div class="footer-status">支持 PPT、PDF、Word、视频直链提取</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
